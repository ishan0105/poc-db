version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing MySQL client and required dependencies..."
      - pip install psycopg2-binary
      - pip install --upgrade pip

  build:
    commands:
      - echo "Running Python script to add a column to RDS MySQL database..."
      - python add_column.py

